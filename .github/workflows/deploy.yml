name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - backend  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "wes.gb31@gmail.com"
          git config --global user.name "WesleyG31"
          
          # Clona el espacio desde Hugging Face
          git clone https://huggingface.co/spaces/WesleyGonzales/qloo-hackaton-api space
          
          # Copia el contenido de tu repo al repo del Space (excepto .git)
          rsync -av --exclude='.git' ./ space/
          
          cd space
          git add .
          git commit -m "Deploy from GitHub Actions (backend branch)" || echo "Nothing to commit"
          git push https://user:$HF_TOKEN@huggingface.co/spaces/WesleyGonzales/qloo-hackaton-api main
